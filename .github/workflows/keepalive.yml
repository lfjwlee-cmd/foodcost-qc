name: supabase-keepalive
# 무료 Supabase 프로젝트가 미사용으로 자동 정지되는 것을 막기 위해
# 매일 1회 아주 가벼운 읽기 요청을 보낸다. (데이터 변경 없음)
on:
  schedule:
    - cron: '23 2 * * *'   # 매일 UTC 02:23 (한국 11:23)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project awake)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aosqvruvmhaumckwuidn.supabase.co/rest/v1/qc_ledger?select=id&limit=1" \
            -H "apikey: sb_publishable_snEBmk1dvtRdsd63a7ef2g_eqYdbmLk")
          echo "Supabase responded HTTP $code"
          if [ "$code" = "000" ]; then echo "no response"; exit 1; fi
